<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="description" content="Message Spreader">
		<meta name="keywords" content="Message,Spreader">
		<meta name="author" content="Thai Nguyen">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="/favicon.ico" type="image/x-icon">
		<link rel="manifest" href="/manifest.webmanifest">
		<link rel="stylesheet" type="text/css" href="/lib/css/mdb-4.11.0.min.css">
		<link rel="stylesheet" type="text/css" href="/lib/css/style.css">
		<title>Message Spreader</title>
	</head>

	<body class="d-flex flex-column justify-content-start">
<!-- 		<div id="layoutTop">
		</div>

		<hr class="w-100">
--> 
		<div id="listSite" class="btn-group btn-group-sm" data-toggle="buttons">
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-clipboard-list mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="btnMain" value="mainSites" autocomplete="off"> Main
			</label>
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-shield-alt mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="btnTrust" value="trustSites" autocomplete="off"> Trust
			</label>
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-ban mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="btnBlack" value="blackSites" autocomplete="off"> Black
			</label>
		</div>

		<div class="d-flex my-2 px-1 w-100">
			<div class="d-flex justify-content-center align-items-center font-weight-bold text-primary mr-1 w-50">
				<i class="fas fa-retweet mr-1"></i>Rate:
				<span class="d-inline-flex justify-content-center orange-text w-char-3 ml-1 mr-2"><span id="repeatRate"></span>s</span>
				<input id="sliderRate" class="custom-range" type="range" value="10" min="1" max="20" />
			</div>
			<div class="d-flex justify-content-center align-items-center font-weight-bold text-primary ml-1 w-50">
				<i class="fas fa-sort-amount-up mr-1"></i>Top:
				<span id="counterPoint" class="orange-text text-center ml-1 mr-2"></span>
				<input id="sliderCounter" class="custom-range" type="range" value="1" min="1" max="6" />
			</div>
		</div>

		<div id="groupControlButtons" class="d-flex justify-content-between align-items-center">
			<div class="d-flex justify-content-center flex-grow-1">
				<button id="pupBtnStart" class="btn btn-light btn-sm px-3"><i class="fas fa-bullhorn text-primary mr-1"></i> SPREAD</button>
				<button id="pupBtnStop" class="btn btn-light btn-sm px-3 d-none"><i class="fas fa-stop-circle text-danger mr-1"></i> STOP</button>
				<div class="file-field">
					<div class="btn btn-light btn-sm px-3">
						<span><i class="fas fa-upload text-primary mr-1" aria-hidden="true"></i> UPLOAD</span>
						<input id="pupBtnUpload" type="file" multiple>
					</div>
					<div class="file-path-wrapper d-none">
						<input class="file-path validate" type="text" placeholder="Choose file(s)">
					</div>
				</div>
			</div>

			<div class="switch text-primary font-weight-bold">
				<label class="m-0">
					Quiet
					<input id="switchQuiet" type="checkbox" checked>
					<span class="lever"></span>
				</label>
			</div>
		</div>

		<hr class="w-100">

		<div id="layoutTabs" class="d-flex flex-column overflow-auto flex-grow-1 w-100">
			<ul id="tabButtons" class="nav nav-tabs nav-justified md-tabs color-light-blue-active" role="tablist">
				<li class="nav-item">
					<a id="tabLogger" class="nav-link d-flex flex-column align-items-center font-weight-bold active" data-toggle="tab" href="#tabLoggerContent" role="tab" aria-controls="tabLoggerContent" aria-selected="true"><i class="fas fa-newspaper app-iconTab"></i>Logger</a>
				</li>
				<li class="nav-item">
					<a id="tabUrl" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabUrlContent" role="tab" aria-controls="tabUrlContent" aria-selected="false"><i class="fas fa-link app-iconTab"></i>URL</a>
				</li>
				<li class="nav-item">
					<a id="tabMotd" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabMotdContent" role="tab" aria-controls="tabMotdContent" aria-selected="false"><i class="fas fa-comment app-iconTab"></i>Motd</a>
				</li>
				<li class="nav-item">
					<a id="tabUpload" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabUploadContent" role="tab" aria-controls="tabUploadContent" aria-selected="false"><i class="fas fa-upload app-iconTab"></i>Upload</a>
				</li>
				<li class="nav-item d-none">
					<a id="tabCounterAll" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabCounterAllContent" role="tab" aria-controls="tabCounterAllContent" aria-selected="false"><i class="fas fa-newspaper app-iconTab"></i>All</a>
				</li>
				<li class="nav-item d-none">
					<a id="tabCounterSuccess" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabCounterSuccessContent" role="tab" aria-controls="tabCounterSuccessContent" aria-selected="false"><i class="fas fa-newspaper app-iconTab"></i>Success</a>
				</li>
				<li class="nav-item d-none">
					<a id="tabCounterFailed" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabCounterFailedContent" role="tab" aria-controls="tabCounterFailedContent" aria-selected="false"><i class="fas fa-newspaper app-iconTab"></i>Failed</a>
				</li>
				<li class="nav-item d-none">
					<a id="tabStatistic" class="nav-link d-flex flex-column align-items-center font-weight-bold" data-toggle="tab" href="#tabStatisticContent" role="tab" aria-controls="tabStatisticContent" aria-selected="false"><i class="fas fa-newspaper app-iconTab"></i>Statistic</a>
				</li>
			</ul>
			<div id="tabsContainer" class="d-flex flex-column overflow-auto flex-grow-1 w-100 tab-content card pt-4 pb-0 color-light-blue">
				<div id="tabLoggerContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade show active" role="tabpanel" aria-labelledby="tabLogger">
					<div class="d-flex flex-column overflow-auto w-100 h-100">
						<div id="loggerContent" class="overflow-auto flex-grow-1 w-100"></div>
						<div id="puppet-status" class="btn-group w-100" role="group" aria-label="Puppet status">
							<button id="btnTotalRequest" type="button" class="btn btn-orange btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-paper-plane pr-2" aria-hidden="true"></i><span class="counter-total">0</span></div></button>
							<button id="btnTotalSuccess" type="button" class="btn btn-success btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-check-circle pr-2" aria-hidden="true"></i><span class="counter-success">0</span></div></button>
							<button id="btnTotalFailed" type="button" class="btn btn-danger btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-times-circle pr-2" aria-hidden="true"></i><span class="counter-failed">0</span></div></button>
						</div>
					</div>
				</div>
				<div id="tabUrlContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabUrl">
					<div id="urlAccordion" class="d-none flex-column overflow-auto w-100 h-100">
						<div id="alertUrlRowsSelected" class="alert alert-danger alert-dismissible fade show d-none my-1 px-3" role="alert">
							<i class="fas fa-table mr-1"></i>
							<strong id="counterUrlRowsSelected">0</strong> row(s) selected.
							<button id="btnDeleteUrlRowsSelected" type="button" class="d-none btn btn-danger btn-sm btn-rounded my-0 mx-1 py-1 px-2">
								<i class="fas fa-trash mr-1"></i>
								Delete
							</button>
							<button id="btnCloseUrlSelection" type="button" class="close" aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
						<div class="d-flex justify-content-center align-items-center position-relative w-100">
							<button id="urlBtnMainSites" class="btn btn-rounded btn-mdb-color align-self-center text-left font-weight-bold btnCollapse py-2 pr-2 w-75" type="button" data-toggle="collapse" data-target="#urlMainSites" data-parent="#urlAccordion" aria-expanded="false" aria-controls="urlMainSites">
								<i class="fas fa-clipboard-list white text-mdb text-center rounded-pill iconBtnCollapse"></i>
								Main Sites
								<span id="urlMainSitesCounter" class="badge badge-pill badge-danger badge-lg pr-2 ml-2">0</span>
								<i class="fas fa-angle-double-down float-right mt-1 mr-1"></i>
							</button>
							<i id="urlBtnAddMainSites" class="fas fa-plus position-right dark-green-text font-weight-bold fs-20"></i>
						</div>
						<div id="urlMainSites" class="collapse overflow-auto flex-grow-1 contentCollapse" data-parent="#urlAccordion">
							<div id="urlMainSitesContent" class="mt-1"></div>
						</div>

						<div class="d-flex justify-content-center align-items-center position-relative w-100">
							<button id="urlBtnTrustSites" class="btn btn-rounded btn-mdb-color align-self-center text-left font-weight-bold btnCollapse py-2 pr-2 w-75" type="button" data-toggle="collapse" data-target="#urlTrustSites" data-parent="#urlAccordion" aria-expanded="false" aria-controls="urlTrustSites">
								<i class="fas fa-shield-alt white text-mdb text-center rounded-pill iconBtnCollapse"></i>
								Trust Sites
								<span id="urlTrustSitesCounter" class="badge badge-pill badge-danger badge-lg pr-2 ml-2">0</span>
								<i class="fas fa-angle-double-down float-right mt-1 mr-1"></i>
							</button>
							<i id="urlBtnAddTrustSites" class="fas fa-plus position-right dark-green-text font-weight-bold fs-20"></i>
						</div>
						<div id="urlTrustSites" class="collapse overflow-auto flex-grow-1 contentCollapse" data-parent="#urlAccordion">
							<div id="urlTrustSitesContent" class="mt-1"></div>
						</div>

						<div class="d-flex justify-content-center align-items-center position-relative w-100">
							<button id="urlBtnBlackSites" class="btn btn-rounded btn-mdb-color align-self-center text-left font-weight-bold btnCollapse py-2 pr-2 w-75" type="button" data-toggle="collapse" data-target="#urlBlackSites" data-parent="#urlAccordion" aria-expanded="false" aria-controls="urlBlackSites">
								<i class="fas fa-ban white text-mdb text-center rounded-pill iconBtnCollapse"></i>
								Black Sites
								<span id="urlBlackSitesCounter" class="badge badge-pill badge-danger badge-lg pr-2 ml-2">0</span>
								<i class="fas fa-angle-double-down float-right mt-1 mr-1"></i>
							</button>
							<i id="urlBtnAddBlackSites" class="fas fa-plus position-right dark-green-text font-weight-bold fs-20"></i>
						</div>
						<div id="urlBlackSites" class="collapse overflow-auto flex-grow-1 contentCollapse" data-parent="#urlAccordion">
							<div id="urlBlackSitesContent" class="mt-1"></div>
						</div>

						<div id="urlCollapseContent" class="collapse show overflow-auto flex-grow-1 mt-2 w-100" data-parent="#urlAccordion">
							<div id="urlContent" class="mt-1"></div>
						</div>
					</div>
				</div>
				<div id="tabMotdContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabMotd">
					<div class="d-flex flex-column overflow-auto w-100 h-100">
						<div class="card gradient-card heavy-rain-gradient rounded-lg my-2">
							<div class="card-body px-3 py-2 mask">
								<div class="md-form d-flex align-items-center mt-1 mb-0">
									<i class="fas fa-envelope text-muted prefix"></i>
									<input type="text" id="motdMessage" class="form-control flex-grow-1 mb-1">
									<label for="motdMessage">What's on your mind?</label>
									<i id="motdBtnSend" class="d-none fas fa-feather-alt text-primary ml-3"></i>
								</div>
							</div>
						</div>
						<div id="motdContent" class="overflow-auto flex-grow-1 w-100"></div>
					</div>
				</div>
				<div id="tabUploadContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabUpload">
					<div id="uploadAccordion" class="d-flex flex-column overflow-auto w-100 h-100">
						<button id="uploadBtnDirectories" class="d-none btn btn-rounded btn-mdb-color align-self-center text-left font-weight-bold btnCollapse py-2 pr-2 w-75" type="button" data-toggle="collapse" data-target="#uploadDirectories" data-parent="#uploadAccordion" aria-expanded="false" aria-controls="uploadDirectories">
							<i class="fas fa-folder-open white text-mdb text-center rounded-pill iconBtnCollapse"></i>
							Directories
							<span id="uploadDirectoriesCounter" class="badge badge-pill badge-danger badge-lg pr-2 ml-2">0</span>
							<i class="fas fa-angle-double-down float-right mt-1 mr-1"></i>
						</button>
						<div id="uploadDirectories" class="collapse overflow-auto flex-grow-1 contentCollapse" data-parent="#uploadAccordion">
							<div id="uploadDirectoriesContent" class="mt-1"></div>
						</div>

						<button id="uploadBtnFiles" class="d-none btn btn-rounded btn-mdb-color align-self-center text-left font-weight-bold btnCollapse py-2 pr-2 w-75" type="button" data-toggle="collapse" data-target="#uploadFiles" data-parent="#uploadAccordion" aria-expanded="false" aria-controls="uploadFiles">
							<i class="fas fa-file-alt white text-mdb text-center rounded-pill iconBtnCollapse"></i>
							Files
							<span id="uploadFilesCounter" class="badge badge-pill badge-danger badge-lg pr-2 ml-2">0</span>
							<i class="fas fa-angle-double-down float-right mt-1 mr-1"></i>
						</button>
						<div id="uploadFiles" class="collapse overflow-auto flex-grow-1 contentCollapse" data-parent="#uploadAccordion">
							<div id="uploadFilesContent" class="mt-1"></div>
						</div>

						<button id="uploadBtnLinks" class="d-none btn btn-rounded btn-mdb-color align-self-center text-left font-weight-bold btnCollapse py-2 pr-2 w-75" type="button" data-toggle="collapse" data-target="#uploadLinks" data-parent="#uploadAccordion" aria-expanded="false" aria-controls="uploadLinks">
							<i class="fas fa-share white text-mdb text-center rounded-pill iconBtnCollapse"></i>
							Links
							<span id="uploadLinksCounter" class="badge badge-pill badge-danger badge-lg pr-2 ml-2">0</span>
							<i class="fas fa-angle-double-down float-right mt-1 mr-1"></i>
						</button>
						<div id="uploadLinks" class="collapse overflow-auto flex-grow-1 contentCollapse" data-parent="#uploadAccordion">
							<div id="uploadLinksContent" class="mt-1"></div>
						</div>

						<div id="uploadCollapseContent" class="collapse show overflow-auto flex-grow-1 mt-2 w-100" data-parent="#uploadAccordion">
							<div id="uploadContent" class="mt-1"></div>
						</div>
					</div>
				</div>
				<div id="tabCounterAllContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabCounterAll">
					<div class="d-flex flex-column overflow-auto align-items-center w-100 h-100">
						<div class="card text-center text-white color-light-blue-active px-2 mt-1 mb-1 minw-50">
							<div id="tabCounterAllHeader" class="card-header font-weight-bold p-1">Total: <span class="orange-text counter-total">0</span>/<span class="text-success counter-success">0</span>/<span class="text-danger counter-failed">0</span></div>
						</div>
						<div id="counterAllContent" class="overflow-auto flex-grow-1 w-100"></div>
					</div>
				</div>
				<div id="tabCounterSuccessContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabCounterSuccess">
					<div class="d-flex flex-column overflow-auto align-items-center w-100 h-100">
						<div class="card text-center text-white color-light-blue-active px-2 mt-1 mb-1 minw-50">
							<div id="tabCounterSuccessHeader" class="card-header font-weight-bold p-1">Success: <span class="text-success counter-success">0</span>/<span class="orange-text counter-total">0</span></div>
						</div>
						<div id="counterSuccessContent" class="overflow-auto flex-grow-1 w-100"></div>
					</div>
				</div>
				<div id="tabCounterFailedContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabCounterFailed">
					<div class="d-flex flex-column overflow-auto align-items-center w-100 h-100">
						<div class="card text-center text-white color-light-blue-active px-2 mt-1 mb-1 minw-50">
							<div id="tabCounterFailedHeader" class="card-header font-weight-bold p-1">Failed: <span class="text-danger counter-failed">0</span>/<span class="orange-text counter-total">0</span></div>
						</div>
						<div id="counterFailedContent" class="overflow-auto flex-grow-1 w-100"></div>
					</div>
				</div>
				<div id="tabStatisticContent" class="overflow-auto flex-grow-1 w-100 tab-pane fade" role="tabpanel" aria-labelledby="tabStatistic">
					<div class="d-flex flex-column overflow-auto w-100 h-100">
						<div id="statisticContent" class="overflow-auto flex-grow-1 w-100"></div>
					</div>
				</div>
			</div>
		</div>

		<script src="lib/js/mdb-4.11.0.min.js"></script>
		<script src="lib/js/app.js"></script>
	</body>
</html>
