<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="description" content="Localhost test page">
		<meta name="keywords" content="HTML,CSS,JavaScript">
		<meta name="author" content="Thai Nguyen">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="/favicon.ico" type="image/x-icon">
		<link rel="stylesheet" type="text/css" href="/lib/css/mdb-4.11.0.min.css">
		<link rel="stylesheet" type="text/css" href="/lib/css/style.css">
		<title>Test Page</title>
	</head>

	<body class="d-flex flex-column justify-content-start">
		<div id="layoutTop">
			<p>This is test page for <a href="http://localhost:3000">http://localhost:3000</a></p>
			<h6><a href="http://localhost:3000/docs">EBooks Download</a></h6>
		</div>

		<hr class="w-100">

		<div id="listSite" class="btn-group btn-group-sm" data-toggle="buttons">
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-clipboard-list mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="btnMain" value="mainSites" autocomplete="off"> Main
			</label>
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-shield-alt mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="btnTrust" value="trustSites" autocomplete="off"> Trust
			</label>
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-ban mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="btnBlack" value="blackSites" autocomplete="off"> Black
			</label>
		</div>

		<div id="sliderRate" class="d-flex justify-content-center mt-3">
			<span>
				<i class="fas fa-retweet text-primary mr-1"></i>
				<span class="font-weight-bold text-primary mr-1">Rate:</span>
			</span>
			<span class="font-weight-bold orange-text ml-2">10</span><span class="font-weight-bold orange-text mr-3">s</span>
			<span class="font-weight-bold text-primary mr-1">0</span>
			<form class="range-field w-50">
				<input class="border1" type="range" min="0" max="60" />
			</form>
			<span class="font-weight-bold text-primary ml-1">60</span>
		</div>

		<div id="groupControlButtons" class="d-flex justify-content-center">
			<button id="pupBtnStart" class="btn btn-light btn-sm px-3"><i class="fas fa-play-circle text-primary mr-1"></i> START</button>
			<button id="pupBtnStop" class="btn btn-light btn-sm px-3 d-none"><i class="fas fa-stop-circle text-danger mr-1"></i> STOP</button>
			<div class="file-field">
				<div class="btn btn-light btn-sm px-3">
					<span><i class="fas fa-upload text-primary mr-1" aria-hidden="true"></i> UPLOAD</span>
					<input id="pupBtnUpload" type="file" multiple>
				</div>
			</div>
		</div>

		<hr class="w-100">

		<div id="layoutTabs" class="d-flex flex-column overflow-auto flex-grow-1 w-100">
			<ul class="nav nav-tabs nav-justified md-tabs color-light-blue-active" id="tabButtons" role="tablist">
				<li class="nav-item">
					<a class="nav-link active font-weight-bold" id="tabLogger" data-toggle="tab" href="#tabLoggerContent" role="tab" aria-controls="tabLoggerContent" aria-selected="true">Logger</a>
				</li>
				<li class="nav-item">
					<a class="nav-link font-weight-bold" id="tabUrls" data-toggle="tab" href="#tabUrlsContent" role="tab" aria-controls="tabUrlsContent" aria-selected="false">URLs</a>
				</li>
				<li class="nav-item">
					<a class="nav-link font-weight-bold" id="tabStatistic" data-toggle="tab" href="#tabStatisticContent" role="tab" aria-controls="tabStatisticContent" aria-selected="false">Statistic</a>
				</li>
			</ul>
			<div class="d-flex flex-column overflow-auto flex-grow-1 w-100 tab-content card pt-4 color-light-blue pb-0" id="tabsContainer">
				<div class="overflow-auto flex-grow-1 w-100 tab-pane fade show active" id="tabLoggerContent" role="tabpanel" aria-labelledby="tabLogger">
					<div class="d-flex flex-column overflow-auto w-100 h-100">
						<div id="logger" class="overflow-auto flex-grow-1 w-100"></div>
						<div id="puppet-status" class="btn-group w-100" role="group" aria-label="Puppet status">
							<button id="btnTotalRequest" type="button" class="btn btn-orange btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-paper-plane pr-2" aria-hidden="true"></i><span id="cTotalRequest">0</span></div></button>
							<button id="btnTotalSuccess" type="button" class="btn btn-success btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-check-circle pr-2" aria-hidden="true"></i><span id="cTotalSuccess">0</span></div></button>
							<button id="btnTotalFailed" type="button" class="btn btn-danger btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-times-circle pr-2" aria-hidden="true"></i><span id="cTotalFailed">0</span></div></button>
						</div>
					</div>
				</div>
				<div class="overflow-auto flex-grow-1 w-100 tab-pane fade" id="tabUrlsContent" role="tabpanel" aria-labelledby="tabUrls">
					<div class="d-flex flex-column overflow-auto w-100 h-100">
						<p></p>
					</div>
				</div>
				<div class="overflow-auto flex-grow-1 w-100 tab-pane fade" id="tabStatisticContent" role="tabpanel" aria-labelledby="tabStatistic">
					<div class="d-flex flex-column overflow-auto w-100 h-100">
						<p></p>
					</div>
				</div>
			</div>
		</div>

		<script src="lib/js/mdb-4.11.0.min.js"></script>
		<script src="lib/js/app.js"></script>
	</body>
</html>
