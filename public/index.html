<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="description" content="Localhost test page">
		<meta name="keywords" content="HTML,CSS,JavaScript">
		<meta name="author" content="Thai Nguyen">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" type="text/css" href="lib/css/mdb-4.11.0.min.css">
		<link rel="stylesheet" type="text/css" href="lib/css/style.css">
		<title>Test Page</title>
	</head>

	<body>
		<h1>Test Page</h1>
		<p>This is test page for <a href="http://localhost:3000">http://localhost:3000</a></p>
		<h6><a href="http://localhost:3000/docs">EBooks Download</a></h6>

		<hr class="w-100">

		<h3>Puppet</h3>

		<div id="listSite" class="btn-group btn-group-sm" data-toggle="buttons">
			<label class="btn btn-light-blue form-check-label active">
				<i class="fas fa-clipboard-list mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="mainSites" autocomplete="off" checked> Main
			</label>
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-shield-alt mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="trustSites" autocomplete="off"> Trust
			</label>
			<label class="btn btn-light-blue form-check-label">
				<i class="fas fa-ban mr-1"></i>
				<input class="form-check-input" type="radio" name="options" id="blackSites" autocomplete="off"> Black
			</label>
		</div>

		<div class="d-flex justify-content-center">
			<button id="pupBtnStart" class="btn btn-light btn-sm px-3" style="font-size: 12px;"><i class="fas fa-play-circle text-primary mr-1"></i> START</button>
			<button id="pupBtnStop" class="btn btn-light btn-sm px-3" style="font-size: 12px;"><i class="fas fa-stop-circle text-danger mr-1"></i> STOP</button>
			<button id="pupBtnDisconnect" class="btn btn-light btn-sm px-3" style="font-size: 12px;"><i class="fas fa-unlink text-default mr-1"></i> DISCONNECT</button>
		</div>

		<hr class="w-100">

		<div id="logger"></div>
		<div id="puppet-status" class="btn-group" role="group" aria-label="Puppet status">
			<button id="btnTotalRequest" type="button" class="btn btn-orange btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-paper-plane pr-2" aria-hidden="true"></i><span id="cTotalRequest">0</span></div></button>
			<button id="btnTotalSuccess" type="button" class="btn btn-success btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-check-circle pr-2" aria-hidden="true"></i><span id="cTotalSuccess">0</span></div></button>
			<button id="btnTotalFailed" type="button" class="btn btn-danger btn-rounded py-2"><div class="flex-center font-weight-bold"><i class="fas fa-times-circle pr-2" aria-hidden="true"></i><span id="cTotalFailed">0</span></div></button>
		</div>
		<script src="lib/js/mdb-4.11.0.min.js"></script>
		<script src="lib/js/app.js"></script>
	</body>
</html>
