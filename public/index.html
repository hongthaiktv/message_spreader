		<h3>Puppet</h3>
		<form id="fPuppet">
			List: <input type="text" name="urls" value="trustSites"><br>
			<br>
			<button type="button" id="pupBtnStart">Start</button>
			<button type="button" id="pupBtnStop">Stop</button>

			<button type="button" id="pupBtnDisconnect">Disconnect</button>
		</form>

		<hr>

		<div id="logger"></div>
		<div id="puppet-status" class="btn-group" role="group" aria-label="Puppet status">
			<button id="btnTotalRequest" type="button" class="btn btn-orange btn-rounded py-2"><div class="font-weight-bold"><div class="flex-center"><i class="fas fa-paper-plane pr-2" aria-hidden="true"></i>Total</div><div id="cTotalRequest">0</div></div></button>
			<button id="btnTotalSuccess" type="button" class="btn btn-success btn-rounded py-2"><div class="font-weight-bold"><div class="flex-center"><i class="fas fa-check-circle pr-2" aria-hidden="true"></i>Success</div><div id="cTotalSuccess">0</div></div></button>
			<button id="btnTotalFailed" type="button" class="btn btn-danger btn-rounded py-2"><div class="font-weight-bold"><div class="flex-center"><i class="fas fa-times-circle pr-2" aria-hidden="true"></i>Failed</div><div id="cTotalFailed">0</div></div></button>
