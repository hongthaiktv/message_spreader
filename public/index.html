<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="description" content="Localhost test page">
		<meta name="keywords" content="HTML,CSS,JavaScript">
		<meta name="author" content="Thai Nguyen">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" type="text/css" href="lib/css/style.css">
		<title>Test Page</title>
	</head>

	<body>
		<h1>Test Page</h1>
		<p>This is test page for <a href="http://localhost:3000">http://localhost:3000</a></p>
		<h4><a href="http://localhost:3000/docs">EBooks Download</a></h4>

		<hr>

		<form id="fData">
			First name: <input type="text" name="fname"><br>
			Last name: <input type="text" name="lname"><br>
			<input id="submit" type="button" value="Submit">
		</form>

		<hr>

		<h3>Puppet</h3>
		<form id="fPuppet">
			List: <input type="text" name="urls" value="mainSites"><br>
			<br>
			<button type="button" id="pupBtnStart">Start</button>
			<button type="button" id="pupBtnStop">Stop</button>
			<button type="button" id="pupBtnChange">Change</button>
			<button type="button" id="pupBtnDisconnect">Disconnect</button>
		</form>

		<hr>

		<div id="logger"></div>
		<script>
			submit.onclick = async function(e) {
				e.preventDefault();
				let data = {
					fname: fData.fname.value,
					lname: fData.lname.value
				};
				const response = await fetch("http://localhost:3000/post", {
					method: "POST",
					body: JSON.stringify(data),
					headers: {
						"Content-Type": "application/json"
					}
				});
				if (response.ok) {
					let res = await response.json();
					logger.innerText = res.result
				}
				else logger.innerText = `request error ${response.status}!`;
			}
			
			//puppet
			let source = new EventSource("http://localhost:3000/logger");
			source.onmessage = e => log(e.data);
			source.onerror = e => log("Logger disconnected.");
			async function puppet(action, urls = "mainSites") {
				let data = {
					action: action,
					urls: urls
				};
				const response = await fetch("http://localhost:3000/puppet", {
					method: "POST",
					body: JSON.stringify(data),
					headers: {
						"Content-Type": "application/json"
					}
				});
				if (response.ok) {
					let res = await response.json();
					let msg = res.result;
					log(msg);
				}
				else {
					let msg = `Request error ${response.status}!`;
					log(msg);
				}
			}

			pupBtnStart.onclick = function(e) {
				puppet("start");
			};

			pupBtnStop.onclick = function(e) {
				puppet("stop");
			};

			pupBtnChange.onclick = function(e) {
				const urls = fPuppet.urls.value;
				puppet("change", urls);
			};

			pupBtnDisconnect.onclick = function(e) {
				source.close();
				log("disconnected");
			};

			function log(msg) {
				let divMsg = document.createElement("DIV");
				divMsg.innerText = msg;
				logger.appendChild(divMsg);
				logger.scrollTop = logger.scrollHeight;
			}
		</script>
	</body>
</html>
